name: Feature request
description: Propose an evidence rule, industry pack, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: decision
    attributes:
      label: Decision problem
      description: Which real research decision would this improve?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed evidence rule or workflow
      description: Describe sources, metrics, prohibited inferences, and decision-level impact.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Could this change the 10-section format, export interfaces, or schema 1.0 behavior?
