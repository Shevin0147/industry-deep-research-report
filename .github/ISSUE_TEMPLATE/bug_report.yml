name: Bug report
description: Report a reproducible problem in the Skill, validator, or export flow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the prompt, mode, decision level, and evidence packs. Remove sensitive data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, Codex desktop
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste the smallest useful error. Do not include secrets.
