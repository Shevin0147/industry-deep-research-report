name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: |
          python -m py_compile \
            industry-deep-research-report/scripts/validate_report.py \
            industry-deep-research-report/scripts/export_report_pdf.py
      - name: Validate industry packs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pack_dir = Path("industry-deep-research-report/references/industry-packs")
          expected = {"consumer-retail", "saas-ai", "manufacturing", "ecommerce-platform", "healthcare", "restaurant-local-service"}
          files = list(pack_dir.glob("*.json"))
          found = set()
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["id"] == path.stem, f"Pack ID mismatch: {path}"
              assert set(data["requirements_by_level"]) == {"L1", "L2", "L3", "L4"}
              found.add(data["id"])
          assert found == expected, f"Unexpected pack set: {found}"
          print(f"Validated {len(files)} industry packs")
          PY
      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Build installable package
        run: |
          python scripts/package_skill.py
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("dist/industry-deep-research-report.zip")
          with ZipFile(archive) as package:
              names = package.namelist()
          assert "industry-deep-research-report/SKILL.md" in names
          assert all("__pycache__" not in name and ".research/" not in name for name in names)
          print(f"Validated package with {len(names)} files")
          PY
      - name: Check validator CLI
        run: python industry-deep-research-report/scripts/validate_report.py --help
